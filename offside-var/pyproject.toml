[project]
name = "offside"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "ultralytics>=8.3",
  "supervision>=0.25",
  "opencv-python>=4.9",
  "numpy",
  "scikit-learn",
  "tqdm",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
